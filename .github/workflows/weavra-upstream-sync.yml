name: Weavra Upstream Sync

on:
  push:
    branches: [main]
  schedule:
    # 07:10 KST (22:10 UTC, previous day)
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weavra-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream -> main -> devlop
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch fork and upstream
        run: |
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch --prune origin main devlop
          git fetch --prune upstream main

      - name: Sync upstream into main
        run: |
          git switch -C main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main."
          else
            if ! git merge --no-edit upstream/main -m "chore(sync): merge upstream main"; then
              git merge --abort || true
              echo "::error::Conflict while merging earendil-works/pi main into fork main."
              exit 1
            fi
          fi

          git push origin main

      - name: Merge main into devlop
        id: merge_devlop
        run: |
          MAIN_SHA="$(git rev-parse main)"
          git switch -C devlop origin/devlop

          if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "devlop already contains current main."
            exit 0
          fi

          if ! git merge --no-ff --no-edit "$MAIN_SHA" -m "chore(sync): merge main into devlop"; then
            git merge --abort || true
            echo "::error::Conflict while merging fork main into devlop. devlop was not pushed."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.merge_devlop.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        if: steps.merge_devlop.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        if: steps.merge_devlop.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.merge_devlop.outputs.changed == 'true'
        run: npm run build

      - name: Check
        if: steps.merge_devlop.outputs.changed == 'true'
        run: npm run check:ci

      - name: Test
        if: steps.merge_devlop.outputs.changed == 'true'
        run: npm test

      - name: Push validated devlop
        if: steps.merge_devlop.outputs.changed == 'true'
        run: |
          # Deliberately avoid force-push. If devlop changed while validation was
          # running, this push fails and preserves the newer developer work.
          git push origin HEAD:devlop

      - name: Write success summary
        if: success()
        run: |
          {
            echo "## Weavra upstream sync"
            echo
            echo "- Upstream: earendil-works/pi:main"
            echo "- Fork main: ${{ github.repository }}:main"
            echo "- Development branch: devlop"
            echo "- devlop changed: ${{ steps.merge_devlop.outputs.changed || 'false' }}"
            echo "- Result: success"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Weavra upstream sync failed"
            echo
            echo "No force-push was used. If the failure happened during the devlop merge or validation, the remote devlop branch was left untouched."
            echo
            echo "Review this run and resolve conflicts/tests manually before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
