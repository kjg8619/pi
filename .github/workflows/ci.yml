name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:
    branches: [main, devlop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # bubblewrap + socat are required by the verifier sandbox (V0.4C) Linux backend; ripgrep is already listed.
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep bubblewrap socat
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The normal build regenerates tracked *.models.ts catalogs. CI validates committed source instead.
      - name: Hydrate ignored model data
        run: npm run hydrate:model-data

      - name: Build committed source
        run: npm run build:offline

      - name: Check (non-mutating)
        run: npm run check:ci

      - name: Test (isolated, no Provider credentials)
        run: bash ./test.sh

      - name: Launcher syntax
        run: bash -n packages/company-runtime/bin/weavra

      - name: Tracked source unchanged
        if: always()
        run: git diff --exit-code HEAD --

  verifier-sandbox-linux:
    # bubblewrap cannot configure a network namespace loopback on ubuntu-latest (restricted unprivileged userns);
    # this job runs the real Linux sandbox boundary on a supported image instead of weakening host security.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install sandbox backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verifier sandbox Linux actual
        run: |
          cd packages/company-runtime
          node "$(git rev-parse --show-toplevel)/node_modules/vitest/dist/cli.js" --run --maxWorkers=2 test/sandbox.test.ts

      - name: Tracked source unchanged
        if: always()
        run: git diff --exit-code HEAD --
